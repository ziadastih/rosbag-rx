<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosbag Manager</title>
  </head>
  <body>
    <input type="file" id="bag-input" />
    <button id="start-btn">start</button>
    <button id="pause-btn">pause</button>
    <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.01" />
    <span id="current-time">00:00</span> / <span id="end-time">00:00</span>
    <pre id="json-output"></pre>
    <script src="bundle.js"></script>
  </body>
</html>
